name: Release

# Pushing a version tag (e.g. 1.8.1 or v1.8.1) builds the package and publishes it as a GitHub release.
# The tag must match "version" in Assets/package.json.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  PACKAGE_DIR: Assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r .version "$PACKAGE_DIR/package.json")"
          name="$(jq -r .name "$PACKAGE_DIR/package.json")"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag '$tag' doesn't match version '$version' in $PACKAGE_DIR/package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build UPM tarball
        run: |
          mkdir -p dist
          npm pack "./$PACKAGE_DIR" --pack-destination dist

      - name: Build .unitypackage
        run: |
          python3 .github/scripts/build_unitypackage.py "$PACKAGE_DIR" Assets/FastScriptReload \
            "dist/Fast.Script.Reload-${{ steps.version.outputs.version }}.unitypackage"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_NAME: ${{ steps.version.outputs.name }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            notes="$(cat <<EOF
          Install via Package Manager → **+** → **Add package from git URL**:
          \`\`\`
          https://github.com/${GITHUB_REPOSITORY}.git?path=/${PACKAGE_DIR}#${tag}
          \`\`\`
          Or download \`${PACKAGE_NAME}-${VERSION}.tgz\` and use **Add package from tarball**, or import the \`.unitypackage\`.
          EOF
          )"
            gh release create "$tag" dist/* --title "$tag" --notes "$notes" --generate-notes $prerelease
          fi
